name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    env:
      # Compile-only value. Deployments must provide the real production API URL.
      VITE_API_URL: https://api.example.invalid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run root lint
        run: npm run lint

      - name: Run frontend type check
        run: npm --prefix frontend exec -- tsc -b frontend/tsconfig.json

      - name: Run root production build
        run: npm run build

      - name: Run frontend lint
        run: npm --prefix frontend run lint

      - name: Run frontend production build
        run: npm --prefix frontend run build
